<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoulGraph</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 1 C17 12 20 15 31 16 C20 17 17 20 16 31 C15 20 12 17 1 16 C12 15 15 12 16 1Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1 C17 12 20 15 31 16 C20 17 17 20 16 31 C15 20 12 17 1 16 C12 15 15 12 16 1Z"/></svg>
      <span class="brand-name glitch" data-text="SOULGRAPH">SOULGRAPH</span>
      <a class="by" href="https://github.com/vyxode/soulgraph" target="_blank" rel="noopener">by <span class="glitch" data-text="VYXODE">VYXODE</span></a>
      <span class="project" id="project-name"></span>
    </div>
    <div class="status">
      <span class="pill" id="live-pill"><i></i><span></span></span>
      <span class="pill" id="studio-pill"><i></i><span></span></span>
      <button class="ghost" id="lang-btn" type="button"></button>
    </div>
  </header>

  <aside class="sidebar" aria-label="Filters">
    <div class="segmented" id="search-mode" role="group">
      <button type="button" data-mode="names" aria-pressed="true" data-i18n="modeNames"></button>
      <button type="button" data-mode="code" aria-pressed="false" data-i18n="modeCode"></button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="search" type="search" autocomplete="off" spellcheck="false">
    </label>
    <p class="hint" id="search-hint"></p>
    <div class="code-results" id="code-results"></div>

    <details class="block" open>
      <summary><h2 data-i18n="recent"></h2></summary>
      <button class="filter off" id="only-recent" type="button" aria-pressed="false">
        <span class="dot" style="color:#ffffff"></span><span class="label" data-i18n="onlyRecent"></span>
      </button>
      <div class="links-list" id="recent-list"></div>
    </details>

    <details class="block">
      <summary><h2 data-i18n="health"></h2><span class="badge" id="health-count"></span></summary>
      <div id="health-list"></div>
    </details>

    <section>
      <h2 data-i18n="sources"></h2>
      <div id="source-filters"></div>
    </section>
    <section>
      <h2 data-i18n="kinds"></h2>
      <div id="kind-filters"></div>
    </section>
    <section>
      <h2 data-i18n="links"></h2>
      <div id="link-filters"></div>
    </section>
    <section>
      <h2 data-i18n="labels"></h2>
      <div class="segmented" id="label-mode" role="group">
        <button type="button" data-mode="off" data-i18n="labelsOff"></button>
        <button type="button" data-mode="main" data-i18n="labelsMain"></button>
        <button type="button" data-mode="all" data-i18n="labelsAll"></button>
      </div>
    </section>

    <footer>
      <span id="stats"></span>
      <button class="ghost" id="reset-btn" type="button" data-i18n="resetView"></button>
    </footer>
  </aside>

  <main id="graph" aria-label="Graph"></main>

  <aside class="inspector" id="inspector" hidden></aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/graph-bundle.js"></script>
  <script src="vendor/editor-bundle.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
